services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-learn-backend:latest
    container_name: ai-learn-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: production
      # MySQL 容器需先接入本 Compose 网络，见 deploy/README.md
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
    ports:
      - "8000:8000"
    volumes:
      - ai_learn_data:/app/backend/data
      - ai_learn_logs:/app/backend/logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ai_learn_data:
  ai_learn_logs:
